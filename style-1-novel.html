<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>样式一 · 立绘对话</title>
<link rel="stylesheet" href="nav.css" />
<style>
  :root{
    --gold:#d9a441; --gold2:#f0d878; --goldD:#7a5f1c;
    --red:#d84a52; --red2:#ff6b73; --grn:#35c48a;
    --tx:#efe6d6; --dim:#a8967c; --faint:#6b5b46;
    --serif:"Songti SC","STSong","SimSun",Georgia,serif;
    --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    --mono:ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#050303;color:var(--tx);font-family:var(--sans)}
  #stage{position:fixed;inset:46px 0 0 0;display:grid;place-items:center}
  .screen{position:relative;width:1600px;height:900px;overflow:hidden;border-radius:8px;
    border:1px solid #54401f;box-shadow:0 30px 80px rgba(0,0,0,.9);transform-origin:center}

  .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.34) saturate(.8)}
  .veil{position:absolute;inset:0;
    background:radial-gradient(70% 60% at 50% 34%,transparent 10%,rgba(4,2,2,.85) 78%)}
  .hero{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:700px;height:92%;
    background-size:contain;background-position:bottom center;background-repeat:no-repeat;
    -webkit-mask-image:radial-gradient(56% 62% at 50% 48%,#000 44%,transparent 86%);
    mask-image:radial-gradient(56% 62% at 50% 48%,#000 44%,transparent 86%);
    transition:opacity .35s, transform .35s}

  /* 顶部资源条 —— 极简 */
  .hud{position:absolute;top:0;left:0;right:0;z-index:6;height:52px;display:flex;align-items:center;gap:14px;
    padding:0 22px;background:linear-gradient(180deg,rgba(10,5,5,.8),transparent)}
  .hud .c{font-family:var(--serif);font-size:14px;letter-spacing:.14em;color:var(--gold2)}
  .hud .c small{font-family:var(--sans);font-size:11px;color:var(--dim);margin-left:8px;letter-spacing:.08em}
  .sp{flex:1}
  .res{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.14em;color:var(--dim)}
  .pips{display:flex;gap:3px}
  .pips i{width:10px;height:15px;border-radius:2px;border:1px solid rgba(216,74,82,.45);background:rgba(255,255,255,.05)}
  .pips.heart i{border-color:rgba(240,216,120,.4)}
  .pips.heart i.on{background:linear-gradient(180deg,#ffe9a8,#d9a441);border-color:#f0d878;box-shadow:0 0 8px rgba(240,216,120,.8)}
  .pips.greed i{transform:skewX(-10deg)}
  .pips.greed i.on{background:linear-gradient(180deg,#ff6a72,#8c1018);border-color:#ffb0b5;box-shadow:0 0 9px rgba(255,90,99,.85)}
  .chip{font-family:var(--mono);font-size:14px;font-weight:800;color:var(--gold2)}

  /* 执念条 */
  .obs{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:6;width:440px;display:none;
    align-items:center;gap:12px;padding:8px 14px;border:1px solid rgba(216,74,82,.5);border-radius:20px;
    background:rgba(30,6,10,.8)}
  .obs.on{display:flex}
  .obs .n{font-family:var(--serif);font-size:13px;color:#ffd0d4;white-space:nowrap;letter-spacing:.06em}
  .obs .bar{flex:1;height:10px;border-radius:5px;background:rgba(0,0,0,.6);overflow:hidden;border:1px solid rgba(216,74,82,.4)}
  .obs .bar i{display:block;height:100%;background:linear-gradient(90deg,#7a1018,#e2434e 60%,#ff8f8f);
    box-shadow:0 0 12px rgba(226,67,78,.8);transition:width .5s}
  .obs .v{font-family:var(--mono);font-size:13px;color:#ffb0b5;font-weight:800}

  /* 对话框 —— VN 的核心 */
  .box{position:absolute;left:0;right:0;bottom:0;z-index:7;height:270px;padding:0 60px 34px;
    display:flex;flex-direction:column;justify-content:flex-end}
  .frame{position:relative;border:1px solid var(--goldD);border-radius:6px;padding:30px 40px 30px;
    background:linear-gradient(180deg,rgba(22,13,11,.96),rgba(10,6,5,.985));
    box-shadow:0 0 0 1px rgba(240,216,120,.1),0 -12px 50px rgba(0,0,0,.8),inset 0 1px 0 rgba(240,216,120,.08)}
  .frame::before,.frame::after{content:"";position:absolute;width:7px;height:7px;transform:rotate(45deg);
    background:linear-gradient(135deg,var(--gold2),var(--goldD))}
  .frame::before{left:-4px;top:-4px} .frame::after{right:-4px;bottom:-4px}
  .who{position:absolute;top:-15px;left:34px;padding:5px 16px;border:1px solid var(--goldD);border-radius:3px;
    font-size:12px;letter-spacing:.22em;color:var(--gold2);
    background:linear-gradient(180deg,#3a2412,#160c06);box-shadow:0 6px 16px rgba(0,0,0,.7)}
  .say{font-family:var(--serif);font-size:21px;line-height:2.05;color:#f2e9d8;min-height:96px;text-shadow:0 2px 8px #000}
  .aside{margin-top:12px;font-size:13.5px;color:var(--dim);line-height:1.9;font-family:var(--sans)}
  .cursor{display:inline-block;width:10px;height:21px;background:var(--gold2);vertical-align:-4px;animation:bl .9s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  .more{position:absolute;right:26px;bottom:18px;color:var(--gold);font-size:13px;animation:bob 1.1s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(4px);opacity:.5}}

  /* 选项 —— 浮在对话框上方的居中一列 */
  .choices{position:absolute;left:50%;bottom:296px;transform:translateX(-50%);z-index:8;width:820px;
    display:flex;flex-direction:column;gap:9px;opacity:0;pointer-events:none;transition:.25s}
  .choices.on{opacity:1;pointer-events:auto}
  .ch{display:flex;align-items:center;gap:16px;padding:15px 24px;cursor:pointer;border-radius:4px;
    border:1px solid var(--goldD);background:linear-gradient(180deg,rgba(40,24,14,.95),rgba(16,9,6,.97));
    box-shadow:0 10px 26px rgba(0,0,0,.7);transition:.12s}
  .ch:hover{transform:translateX(6px);border-color:var(--gold2);
    background:linear-gradient(180deg,rgba(66,42,20,.96),rgba(24,14,8,.98));
    box-shadow:0 0 30px rgba(217,164,65,.35),0 10px 26px rgba(0,0,0,.7)}
  .ch .n{font-family:var(--mono);font-size:13px;color:var(--faint);width:16px}
  .ch .t{flex:1;font-size:16px;color:var(--tx);font-family:var(--serif);letter-spacing:.04em}
  .ch .dc{font-family:var(--mono);font-size:11.5px;padding:4px 11px;border-radius:3px;
    border:1px solid var(--goldD);color:var(--gold);background:rgba(217,164,65,.1);white-space:nowrap}
  .ch .dc.hard{border-color:rgba(216,74,82,.6);color:#ff9aa1;background:rgba(216,74,82,.12)}
  .ch .dc.easy{border-color:rgba(53,196,138,.5);color:#7ff0c0;background:rgba(53,196,138,.1)}

  /* 骰子浮层 */
  .roll{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    background:rgba(4,2,3,.85);backdrop-filter:blur(4px)}
  .roll.on{display:flex}
  .rollbox{width:860px;text-align:center;border:1px solid var(--goldD);border-radius:8px;padding:36px 44px;
    background:linear-gradient(180deg,rgba(30,18,12,.97),rgba(10,6,5,.99));box-shadow:0 0 90px rgba(0,0,0,.9)}
  .die{width:190px;height:190px;margin:0 auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.8))}
  .die.shake{animation:sh .1s linear infinite}
  @keyframes sh{0%{transform:rotate(-7deg)}50%{transform:rotate(7deg) translateY(-5px)}100%{transform:rotate(-7deg)}}
  .rnum{font-family:var(--mono);font-size:56px;font-weight:900;line-height:1;color:var(--gold2);margin-top:14px;
    text-shadow:0 0 34px rgba(240,216,120,.5)}
  .req{margin-top:6px;font-family:var(--mono);font-size:14px;color:var(--dim)}
  .rv{margin-top:12px;font-family:var(--serif);font-size:26px;letter-spacing:.34em;color:#7ff0c0}
  .rt{margin-top:16px;font-family:var(--serif);font-size:18px;line-height:2.05;color:#e8dcc6;text-align:left}
  .re{margin-top:14px;font-family:var(--mono);font-size:13px;color:var(--gold)}
  .rn{margin-top:20px}
  .btn{display:inline-block;padding:12px 34px;cursor:pointer;border:1px solid var(--goldD);border-radius:4px;
    font-family:var(--serif);font-size:15px;letter-spacing:.16em;color:#2c1a04;
    background:linear-gradient(180deg,#f7e3a1,#d3a63f 46%,#9c7520);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 0 #5c450e}
  .btn:hover{filter:brightness(1.08)}
  .roll.no .rnum{color:#ff8f8f;text-shadow:0 0 34px rgba(216,74,82,.5)}
  .roll.no .rv{color:#ff8f8f}
  .roll.crit .rnum{color:#fff3c8;text-shadow:0 0 50px rgba(255,243,200,.95)}
  .roll.crit .rv{color:#fff3c8}

  .end{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;background:rgba(4,2,3,.9)}
  .end.on{display:flex}
  .end .t{font-family:var(--serif);font-size:46px;letter-spacing:.3em}
  .end .d{font-family:var(--serif);font-size:18px;line-height:2.2;color:#ded3bf;text-align:center;max-width:700px}

  /* 返回条 */
  .back{position:absolute;top:14px;left:18px;z-index:9;font-size:12px;color:var(--dim);cursor:pointer;
    border:1px solid #3a2c1c;border-radius:3px;padding:5px 12px;background:rgba(10,6,5,.7)}
  .back:hover{color:var(--gold);border-color:var(--goldD)}
</style>
</head>
<body>
<div id="stage">
<div class="screen" id="screen">
  <div class="bg" id="bg"></div>
  <div class="veil"></div>
  <div class="hero" id="hero"></div>

  <div class="hud">
    <div class="c" id="chap">第一章 · 第七层<small id="room">三号厅</small></div>
    <span class="sp"></span>
    <div class="res">心 态<div class="pips heart" id="pHp"></div></div>
    <div class="res">贪 婪<div class="pips greed" id="pGreed"></div></div>
    <div class="res"><span class="chip"><span style="font-size:11px;color:var(--dim);margin-right:6px">筹码</span><span id="nChip">3</span></span></div>
  </div>

  <div class="obs" id="obs">
    <span class="n" id="obsName">对倒幽灵</span>
    <div class="bar"><i id="obsBar" style="width:60%"></i></div>
    <span class="v" id="obsNum">5 / 8</span>
  </div>

  <div class="choices" id="choices"></div>

  <div class="box">
    <div class="frame">
      <div class="who" id="who">主 持 人 · 大 A</div>
      <div class="say" id="say"></div>
      <div class="aside" id="aside"></div>
      <div class="more" id="more" style="display:none">▼</div>
    </div>
  </div>

  <div class="roll" id="rollLayer">
    <div class="rollbox">
      <div class="die" id="die"></div>
      <div class="rnum" id="rNum">–</div>
      <div class="req" id="rEq">…</div>
      <div class="rv" id="rV"></div>
      <div class="rt" id="rT"></div>
      <div class="re" id="rE"></div>
      <div class="rn" id="rN"></div>
    </div>
  </div>

  <div class="end" id="end">
    <div class="t" id="endT"></div>
    <div class="d" id="endD"></div>
    <div style="display:flex;gap:12px;margin-top:8px">
      <span class="btn" onclick="restart()">再 走 一 遍</span>
      <span class="btn" style="background:none;color:var(--gold);border-color:var(--goldD);box-shadow:none"
        onclick="location.href='style-index.html'">换 个 样 式</span>
    </div>
  </div>
</div>
</div>

<script src="engine.js"></script>
<script>
const Q = (s) => document.querySelector(s);
const S = GAME.newState();
let typing = null, busy = false;

function fit() {
  const s = Math.min(innerWidth / 1620, (innerHeight - 46) / 920);
  Q('#screen').style.transform = 'scale(' + s + ')';
}
addEventListener('resize', fit); fit();

function dieSVG(n, state) {
  const g = state === 'crit' ? ['#fffbe8', '#f2d071', '#b8860b']
    : state === 'no' ? ['#e8a0a8', '#a3232b', '#5e1016']
    : ['#fdf3d8', '#e2cd9c', '#a98c56'];
  const ink = state === 'no' ? '#fff2f3' : '#2b2013';
  const u = 'g' + Math.random().toString(36).slice(2, 7);
  return `<svg viewBox="0 0 200 200" style="width:100%;height:100%">
    <defs><linearGradient id="${u}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${g[0]}"/><stop offset=".46" stop-color="${g[1]}"/><stop offset="1" stop-color="${g[2]}"/>
    </linearGradient></defs>
    <polygon points="100,6 170,46 170,154 100,194 30,154 30,46" fill="url(#${u})" stroke="#6b5230" stroke-width="3"/>
    <polygon points="100,6 170,46 100,100" fill="rgba(255,255,255,.34)"/>
    <polygon points="170,46 170,154 100,100" fill="rgba(0,0,0,.07)"/>
    <polygon points="170,154 100,194 100,100" fill="rgba(0,0,0,.15)"/>
    <polygon points="100,194 30,154 100,100" fill="rgba(0,0,0,.22)"/>
    <polygon points="30,154 30,46 100,100" fill="rgba(0,0,0,.1)"/>
    <polygon points="30,46 100,6 100,100" fill="rgba(255,255,255,.18)"/>
    <text x="100" y="122" text-anchor="middle" font-family="ui-monospace,monospace"
      font-size="${String(n).length > 1 ? 74 : 86}" font-weight="900" fill="${ink}">${n}</text></svg>`;
}

function pips(el, n, max) { el.innerHTML = Array.from({ length: max }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join(''); }
function renderHud() {
  pips(Q('#pHp'), S.hp, S.hpMax);
  pips(Q('#pGreed'), S.greed, S.greedMax);
  Q('#nChip').textContent = S.chip;
  if (S.obs) {
    Q('#obs').classList.add('on');
    Q('#obsBar').style.width = Math.max(0, S.obs.cur / S.obs.max * 100) + '%';
    Q('#obsNum').textContent = Math.max(0, S.obs.cur) + ' / ' + S.obs.max;
  } else Q('#obs').classList.remove('on');
}

function typeInto(el, text, done) {
  clearInterval(typing);
  const plain = text;
  let i = 0;
  el.innerHTML = '<span class="cursor"></span>';
  typing = setInterval(() => {
    i += 2;
    if (i % 6 === 0) GAME.sfx('tick');
    el.innerHTML = text.slice(0, i).replace(/\n/g, '<br>') + '<span class="cursor"></span>';
    if (i >= plain.length) { clearInterval(typing); el.innerHTML = text.replace(/\n/g, '<br>'); done && done(); }
  }, 16);
}

function playBeat() {
  const b = GAME.BEATS[S.beat];
  busy = true;
  Q('#choices').classList.remove('on');
  Q('#choices').innerHTML = '';
  Q('#more').style.display = 'none';
  Q('#who').textContent = b.who;
  Q('#hero').style.backgroundImage = `url('${b.art}')`;
  Q('#hero').style.opacity = '.5';
  Q('#hero').style.transform = 'translateX(-50%) scale(.96)';
  S.obs = b.obs ? { cur: b.obs.cur, max: b.obs.max } : null;
  Q('#obsName').textContent = (b.who.split('·')[1] || '').trim() || '对倒幽灵';
  renderHud();
  Q('#aside').textContent = '';
  typeInto(Q('#say'), b.text, () => {
    Q('#hero').style.opacity = '1';
    Q('#hero').style.transform = 'translateX(-50%) scale(1)';
    Q('#aside').textContent = b.aside || '';
    Q('#more').style.display = 'block';
    showChoices(b.acts);
    busy = false;
  });
}

function showChoices(acts) {
  Q('#choices').innerHTML = acts.map((a, i) => {
    const cls = a.dc >= 16 ? ' hard' : a.dc <= 11 ? ' easy' : '';
    return `<div class="ch" onclick="pick(${i})">
      <span class="n">${i + 1}</span><span class="t">${a.t}</span>
      <span class="dc${cls}">${a.attr} ${a.dc}</span></div>`;
  }).join('');
  Q('#choices').classList.add('on');
}

function pick(i) {
  if (busy) return;
  busy = true;
  GAME.sfx('click');
  const act = GAME.BEATS[S.beat].acts[i];
  const res = GAME.roll(S, act);
  Q('#choices').classList.remove('on');
  Q('#more').style.display = 'none';

  const layer = Q('#rollLayer');
  layer.className = 'roll on';
  Q('#die').className = 'die shake';
  Q('#rNum').textContent = '…';
  Q('#rEq').textContent = `${act.attr} +${S.attrs[act.attr]}  vs  难度 ${act.dc}`;
  Q('#rV').textContent = ''; Q('#rT').textContent = ''; Q('#rE').textContent = ''; Q('#rN').innerHTML = '';
  Q('#rT').style.display = 'none'; Q('#rE').style.display = 'none';

  let n = 0;
  const spin = setInterval(() => {
    const f = 1 + Math.floor(Math.random() * 20);
    Q('#rNum').textContent = f;
    Q('#die').innerHTML = dieSVG(f, 'roll');
    GAME.sfx('tick');
    if (++n > 12) { clearInterval(spin); settle(); }
  }, 62);

  function settle() {
    const o = GAME.outcome(S, act, res);
    GAME.apply(S, o.eff);
    layer.className = 'roll on ' + (res.crit ? 'crit' : res.pass ? '' : 'no');
    Q('#die').className = 'die';
    Q('#die').innerHTML = dieSVG(res.r, res.crit ? 'crit' : res.pass ? 'ok' : 'no');
    Q('#rNum').textContent = res.r;
    Q('#rEq').textContent = `${res.attr} ${res.r} + ${res.mod}  =  ${res.total}   vs   难度 ${res.dc}`;
    Q('#rV').textContent = o.verdict;
    Q('#rT').style.display = 'block'; Q('#rT').textContent = o.text;
    const et = GAME.effText(o.eff);
    Q('#rE').style.display = et ? 'block' : 'none'; Q('#rE').textContent = et ? '· ' + et : '';
    Q('#rN').innerHTML = '<span class="btn" onclick="closeRoll()">继 续 ▸</span>';
    renderHud();
    if (res.crit) GAME.sfx('crit'); else if (res.pass) GAME.sfx('ok'); else GAME.sfx('no');
  }
}

function closeRoll() {
  GAME.sfx('click');
  Q('#rollLayer').className = 'roll';
  busy = false;
  const e = GAME.ending(S);
  if (e) return showEnd(e);
  const b = GAME.BEATS[S.beat];
  if (b.obs && S.obs && S.obs.cur > 0) return playBeat();
  S.beat++;
  if (S.beat >= GAME.BEATS.length) return showEnd(GAME.ending(S));
  playBeat();
}

function showEnd(e) {
  Q('#endT').textContent = e.t;
  Q('#endT').style.color = e.tone === 'bad' ? '#ff8f8f' : e.tone === 'good' ? '#7ff0c0' : '#f0d878';
  Q('#endD').textContent = e.d;
  Q('#end').classList.add('on');
}

function restart() {
  const fresh = GAME.newState();
  Object.assign(S, fresh);
  Q('#end').classList.remove('on');
  Q('#bg').style.backgroundImage = `url('${GAME.bg}')`;
  playBeat();
}

addEventListener('keydown', (e) => {
  if (Q('#rollLayer').classList.contains('on')) {
    if ((e.key === ' ' || e.key === 'Enter') && Q('#rN').innerHTML) { e.preventDefault(); closeRoll(); }
    return;
  }
  if (/^[1-9]$/.test(e.key)) {
    const el = Q('#choices').children[+e.key - 1];
    if (el && Q('#choices').classList.contains('on')) el.click();
  }
});

Q('#bg').style.backgroundImage = `url('${GAME.bg}')`;
playBeat();
</script>
<script src="nav.js"></script>
</body>
</html>
